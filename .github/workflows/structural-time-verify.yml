name: Structural-Time Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen demo hashes
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          freeze_path = Path("VERIFY/FREEZE_DEMO_SHA256.txt")
          text = freeze_path.read_text(encoding="utf-8")
          lines = [line.strip() for line in text.splitlines() if line.strip()]

          targets = [
              "demo/structural_time.py",
              "demo/structural_time_ai_demo.py",
              "demo/structural_time_interactive_demo.html",
          ]

          def normalize_path(s: str) -> str:
              return s.replace("\\", "/").strip()

          def find_expected_hash(target: str) -> str:
              for i, line in enumerate(lines):
                  if normalize_path(line) == target:
                      for j in range(i + 1, len(lines)):
                          if re.fullmatch(r"[0-9a-fA-F]{64}", lines[j]):
                              return lines[j].lower()
                      break
              raise SystemExit(f"Could not find frozen hash for {target}")

          for target in targets:
              expected = find_expected_hash(target)
              actual = hashlib.sha256(Path(target).read_bytes()).hexdigest().lower()

              print(f"{target}")
              print(f"  expected: {expected}")
              print(f"  actual:   {actual}")

              if actual != expected:
                  raise SystemExit(f"Hash mismatch for {target}")

          print("All frozen demo hashes verified.")
          PY

      - name: Run base demo and verify convergence
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "demo/structural_time.py"],
              capture_output=True,
              text=True,
              check=True,
          )

          output = result.stdout
          print(output)

          assert "--- Node-A ---" in output
          assert "--- Node-B ---" in output
          assert "--- Node-C ---" in output
          assert "'status': 'ABSTAIN'" in output, "Expected ABSTAIN behavior not found"
          assert "=== FINAL COMPARISON ===" in output

          matches = re.findall(r"([ABC]):\s+([0-9a-f]{10})\s+tick:\s+(\d+)", output)
          assert len(matches) == 3, "Could not parse final comparison block"

          hashes = [m[1] for m in matches]
          ticks = [m[2] for m in matches]

          assert len(set(hashes)) == 1, f"Final hashes do not match: {hashes}"
          assert len(set(ticks)) == 1, f"Final ticks do not match: {ticks}"

          print("Base demo convergence verified.")
          PY

      - name: Run AI demo and verify deterministic properties
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "demo/structural_time_ai_demo.py"],
              capture_output=True,
              text=True,
              check=True,
          )

          output = result.stdout
          print(output)

          required = [
              "STRUCTURAL TIME — AI STYLE DEMO",
              "REFERENCE 3-NODE SCENARIO",
              "REPLAY / DIFFERENT GROUPING SCENARIO",
              "CONFLICT VISIBILITY SCENARIO",
              "PERMUTATION-INDEPENDENCE CHECK",
              "Permutation independence    : True",
              "Reference matching replay   : True",
              "Matching certificate        : True",
              "Conflict visible            : True",
              "No forced convergence       : True",
              "No accepted conflict state  : True",
              "same accepted structure -> same structural time",
              "conflicting structure -> ABSTAIN",
          ]

          for item in required:
              assert item in output, f"Missing expected output: {item}"

          print("AI demo deterministic properties verified.")
          PY
